# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Pins an explicit GC for the Kotlin compile daemon: some sandboxed/virtualized environments
# fail JVM auto-GC-selection on daemon startup, which otherwise silently falls back to a much
# slower in-process compile on every build.
kotlin.daemon.jvmargs=-Xmx1536m -XX:+UseG1GC
