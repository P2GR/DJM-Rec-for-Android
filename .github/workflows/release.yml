name: Release Android app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          VERSION=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match version.properties (v${VERSION})."
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && \
            test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
              echo "Android signing secrets are not configured. See README.md."
              exit 1
            }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Install native toolchain
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Verify and build
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease assembleDebug --console=plain

      - name: Verify APKs and create checksums
        shell: bash
        run: |
          APK_RELEASE=$(find app/build/outputs/apk/release -name '*-release.apk' -print -quit)
          APK_DEBUG=$(find app/build/outputs/apk/debug -name '*-debug.apk' -print -quit)
          test -n "$APK_RELEASE"
          test -n "$APK_DEBUG"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_RELEASE"
          "$APKSIGNER" verify --verbose --print-certs "$APK_DEBUG"
          sha256sum "$APK_RELEASE" > "${APK_RELEASE}.sha256"
          sha256sum "$APK_DEBUG" > "${APK_DEBUG}.sha256"
          echo "APK_RELEASE=$APK_RELEASE" >> "$GITHUB_ENV"
          echo "APK_DEBUG=$APK_DEBUG" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$APK_RELEASE" "$APK_RELEASE.sha256"
          "$APK_DEBUG" "$APK_DEBUG.sha256"
          --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
