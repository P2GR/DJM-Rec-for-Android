name: Build & Release

# Push a tag matching v* (e.g. `git tag v0.1 && git push origin v0.1`) to build the app
# and publish debug + release APKs as assets on a new GitHub Release named after the tag.
# Can also be run manually from the Actions tab without pushing a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1 or v0.1)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install pinned NDK & CMake
        # Versions must match app/build.gradle.kts (ndkVersion) and the externalNativeBuild
        # cmake { version = ... } block, so CI builds native code identically to local dev.
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Generate debug keystore (release signing fallback)
        # signingConfigs.release in app/build.gradle.kts falls back to
        # ~/.android/debug.keystore when no keystore.properties is present (it never is in
        # CI — it's gitignored). This keeps `assembleRelease` working out of the box; the
        # resulting "release" APK is debug-signed. Add real signing secrets + a step that
        # writes keystore.properties here if you need a Play-Store-ready release build.
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
            [[ "$V" == v* ]] || V="v$V"
          else
            V="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"

      - name: Build debug & release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --console=plain

      - name: Locate built APKs
        id: apks
        run: |
          echo "debug=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)" >> "$GITHUB_OUTPUT"
          echo "release=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.apks.outputs.release }}
            ${{ steps.apks.outputs.debug }}
