name: Experimental protocol research

on:
  push:
    branches: [experimental]
  pull_request:
    branches: [experimental]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/experimental' || github.base_ref == 'experimental'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install native toolchain
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Verify and build experimental APK
        run: |
          chmod +x gradlew
          ./gradlew lintExperimental testExperimentalUnitTest assembleExperimental --console=plain
      - name: Checksums and source identity
        run: |
          sha256sum app/build/outputs/apk/experimental/*.apk > app/build/outputs/apk/experimental/SHA256SUMS
          git rev-parse HEAD > app/build/outputs/apk/experimental/SOURCE_COMMIT
          cp version.properties app/build/outputs/apk/experimental/version.properties
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: djmrec-experimental-${{ github.sha }}
          path: app/build/outputs/apk/experimental/
          retention-days: 14

          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/experimental' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: djmrec-experimental-${{ github.sha }}
          path: experimental-output
      - name: Prepare download assets
        shell: bash
        run: |
          mkdir release-assets
          mapfile -t apks < <(find experimental-output -maxdepth 1 -name '*.apk')
          test "${#apks[@]}" -eq 1
          test "$(cat experimental-output/SOURCE_COMMIT)" = "$GITHUB_SHA"
          VERSION=$(sed -n 's/^VERSION_NAME=//p' experimental-output/version.properties | tr -d '\r')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          RELEASE_TAG="v${VERSION}-experimental"
          APK_NAME="DJM-Rec-for-Android-${RELEASE_TAG}.apk"
          test "$(basename "${apks[0]}")" = "$APK_NAME"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          cp "${apks[0]}" "release-assets/$APK_NAME"
          cp experimental-output/SOURCE_COMMIT release-assets/SOURCE_COMMIT
          cd release-assets
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
      - name: Publish versioned experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # This tag identifies the downloadable experimental build, never a stable release.
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/$RELEASE_TAG -f sha="$GITHUB_SHA" > /dev/null
          fi
          cat > "$RUNNER_TEMP/experimental-notes.md" <<EOF
          Experimental preview $RELEASE_TAG. Install **$APK_NAME** below.

          Separate package: com.audiopro.djmrec.experimental. Contains Pro DJ Link and USB protocol research; hardware support remains experimental.

          Debug-signed builds can use different signing keys. Android may require uninstalling an earlier experimental build; export recordings first.

          Source commit: $GITHUB_SHA
          Build: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          EOF
          if ! gh release view $RELEASE_TAG > /dev/null 2>&1; then
            gh release create $RELEASE_TAG --verify-tag --draft --prerelease --latest=false \
              --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/experimental-notes.md"
          fi
          gh release upload $RELEASE_TAG release-assets/* --clobber
          gh release edit $RELEASE_TAG --draft=false --prerelease --latest=false \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/experimental-notes.md"
